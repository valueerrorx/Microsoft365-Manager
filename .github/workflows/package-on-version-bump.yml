# Builds AppImage + deb (Linux), portable exe + MSI (Windows), DMG (macOS) and publishes one GitHub Release when package.json "version" changes on main.
name: Package on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write               # OIDC token for Azure Trusted Signing
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          CURR=$(node -p "require('./package.json').version")
          echo "version=$CURR" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch — building version $CURR."
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No parent SHA; treating as first push — building."
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Parent commit not in history; building."
            exit 0
          fi
          PREV=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Could not read previous version; building."
            exit 0
          fi
          if [ "$PREV" != "$CURR" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PREV -> $CURR"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "package.json changed but version is still $CURR — skipping build."
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ELECTRON_BUILDER_PUBLISH: never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: windows-latest
    environment: release        # must match the federated credential subject
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # electron-builder's Invoke-TrustedSigning authenticates via Azure.Identity EnvironmentCredential,
      # which needs the federated token on disk plus the matching env vars
      - name: Set Azure credential env for electron-builder
        shell: pwsh
        run: |
          "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AZURE_FEDERATED_TOKEN_FILE=$(Join-Path $env:RUNNER_TEMP 'azure-federated-token.txt')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # OIDC assertions expire after ~5 min, so refresh immediately before the build signs
      - name: Refresh Azure federated token
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Set-Content -Path $env:AZURE_FEDERATED_TOKEN_FILE -Value $token -NoNewline
      - run: npm run build
        env:
          ELECTRON_BUILDER_PUBLISH: never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.msi

  build-mac:
    needs: check-version
    if: needs.check-version.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .p12 file
        env:
          P12_BASE64_APPLE: ${{ secrets.P12_BASE64_APPLE }}
        run: echo "$P12_BASE64_APPLE" | base64 -d > ./certificate.p12
      - name: Import signing certificate
        env:
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD_APPLE }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import ./certificate.p12 -k ~/Library/Keychains/build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build signed macOS arm64 DMG
        run: npm run build:mac:arm64
        env:
          CSC_LINK: file://./certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD_APPLE }}
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.TEAMID }}
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_DISABLE_LINKS: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          if-no-files-found: error
          path: dist/*.dmg

  release:
    needs: [check-version, build-linux, build-windows, build-mac]
    if: needs.check-version.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTES="- Manual release rebuild"
          else
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            NOTES=$(git log --no-merges -n 40 --pretty=format:'- %s (%h)' HEAD)
          else
            NOTES=$(git log --no-merges --pretty=format:'- %s (%h)' "$BEFORE..HEAD" || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- (no commits in range)"
          fi
          fi
          {
            echo "## Changes"
            echo ""
            echo "$NOTES"
          } > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.check-version.outputs.version }}"
          NAME="Microsoft 365 Manager ${{ needs.check-version.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Manual rerun: deleting existing release $TAG"
              gh release delete "$TAG" --yes --cleanup
            elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Manual rerun: deleting orphan tag $TAG"
              git push origin ":refs/tags/$TAG"
            fi
          fi
          echo "Creating release ${TAG}"
          mapfile -t ASSET_FILES < <(find release-assets -maxdepth 1 -type f | sort)
          if [ "${#ASSET_FILES[@]}" -eq 0 ]; then
            echo "No release asset files in release-assets/"
            ls -la release-assets || true
            exit 1
          fi
          printf 'Assets:\n'
          printf ' %s\n' "${ASSET_FILES[@]}"
          gh release create "$TAG" "${ASSET_FILES[@]}" \
            --title "$NAME" \
            --notes-file release-notes.md
